# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: 嵌入式技术博客
subtitle: '手把手教你玩转嵌入式'
description: '嵌入式技术博客 | STM32 | 物联网 | 电源设计 | 单片机实战教程'
keywords: 嵌入式,STM32,单片机,物联网,电源设计,实战教程
author: peko
language: zh-CN
timezone: Asia/Shanghai

# URL
## GitHub Pages URL
url: https://peko1105.github.io/my-tech-blog
permalink: :abbrlink/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Deployment - GitHub Pages (via GitHub Actions)
deploy:
  type: git
  repo: git@github.com:peko1105/my-tech-blog.git
  branch: gh-pages

# ============ 插件配置 ============

# hexo-abbrlink: 永久链接（短链接，基于 CRC32）
abbrlink:
  alg: crc32
  rep: hex

# hexo-generator-search: 本地搜索
search:
  path: search.xml
  field: post
  content: true
  format: html

# hexo-wordcount: 字数统计
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# hexo-lazyload: 图片懒加载
lazyload:
  enable: true
  loadingImg: /img/loading.svg
  onlypost: false
  offset: 0

# hexo-generator-feed: RSS 订阅
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
